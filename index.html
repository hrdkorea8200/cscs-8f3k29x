<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>촬영장비 안전 수칙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --ink:#15171A; --muted:#5A616B; --line:#D3D8DE;
  --yellow:#FFC800; --yellow-ink:#1A1500;
  --red:#D7263D; --red-bg:#FDECEE;
  --blue:#0B63C9; --blue-bg:#E8F1FC;
  --green:#0F8A4B; --green-bg:#E4F4EB;
  --focus:#0B63C9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1114; --surface:#171B20; --ink:#EEF1F4; --muted:#9AA3AD; --line:#2B323A;
    --red:#FF5468; --red-bg:#2A1519;
    --blue:#5AA2FF; --blue-bg:#13202F;
    --green:#3FCF85; --green-bg:#11261C;
    --focus:#7DB6FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#171B20; --ink:#EEF1F4; --muted:#9AA3AD; --line:#2B323A;
  --red:#FF5468; --red-bg:#2A1519;
  --blue:#5AA2FF; --blue-bg:#13202F;
  --green:#3FCF85; --green-bg:#11261C;
  --focus:#7DB6FF;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.6;letter-spacing:-0.01em;word-break:keep-all}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,p{margin:0}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:6px}
.brand{font-weight:900;font-size:17px;text-decoration:none;display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.brand i{display:inline-block;width:22px;height:22px;background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%)}
.nav{display:flex;gap:2px}
.nav a,.theme{font-size:14px;font-weight:700;text-decoration:none;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:none;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--yellow);color:var(--yellow-ink)}
.nav a:not([aria-current]):hover,.theme:hover{border-color:var(--line)}
.theme{border:1px solid var(--line);padding:8px 10px;line-height:1}
@media (max-width:480px){ .brand span{display:none} .nav a{padding:8px 8px} }

main{max-width:760px;margin:0 auto;padding:16px 16px 56px}

/* ---------- list ---------- */
.intro{padding:12px 0 18px}
.intro h1{font-size:28px;font-weight:900;line-height:1.25;letter-spacing:-0.03em}
.intro p{color:var(--muted);margin-top:6px;font-size:15px}
.commonlink{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--yellow);color:var(--yellow-ink);
  border-radius:12px;padding:14px 16px;margin-bottom:14px;border:2px solid var(--ink)}
.commonlink b{display:block;font-size:17px;font-weight:900}
.commonlink small{font-size:13px;font-weight:500}
.commonlink .go{margin-left:auto;font-size:22px;font-weight:900}
.search{width:100%;padding:14px 16px;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search:focus{border-color:var(--focus);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--surface);
  border:1px solid var(--line);border-left:8px solid var(--yellow);border-radius:12px;padding:14px 16px;min-height:76px}
.item.hi{border-left-color:var(--red)}
.item.mid{border-left-color:var(--yellow)}
.item.lo{border-left-color:var(--green)}
.item:hover{border-top-color:var(--ink);border-right-color:var(--ink);border-bottom-color:var(--ink)}
.item .ic{font-size:30px;line-height:1;flex:none;width:44px;text-align:center}
.item b{display:block;font-size:18px;font-weight:700;line-height:1.3}
.item small{color:var(--muted);font-size:14px}
.item .go{margin-left:auto;font-size:22px;color:var(--muted)}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 12px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* ---------- sign glyphs (ISO-style) ---------- */
.sg{flex:none;width:34px;height:34px;position:relative;display:inline-block}
.sg-mand{background:var(--blue);border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:19px}
.sg-proh{border:4px solid var(--red);border-radius:50%;
  background:linear-gradient(to top right,transparent calc(50% - 2.5px),var(--red) calc(50% - 2.5px),var(--red) calc(50% + 2.5px),transparent calc(50% + 2.5px))}
.sg-warn{background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%);color:var(--yellow-ink);display:inline-flex;align-items:flex-end;justify-content:center;font-weight:900;font-size:16px;padding-bottom:2px}
.sg-safe{background:var(--green);border-radius:6px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:24px}

/* ---------- detail ---------- */
.back{display:inline-block;font-weight:700;font-size:15px;text-decoration:none;padding:10px 0;color:var(--muted)}
.hero{background:var(--yellow);color:var(--yellow-ink);border-radius:14px;overflow:hidden;margin-bottom:16px}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,#15171A 0 14px,var(--yellow) 14px 28px)}
.hero-in{padding:20px 20px 22px}
.hero .cat{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .cat .em{font-size:28px;line-height:1}
.risk{font-weight:900;font-size:13px;padding:3px 10px;border-radius:6px;background:#15171A;color:#FFC800}
.risk.hi{background:#C4122B;color:#fff}
.risk.lo{background:#fff;color:#15171A}
.hero h1{font-size:32px;font-weight:900;line-height:1.2;letter-spacing:-0.035em;margin-top:6px}
.core{margin-top:14px;padding:14px 16px;background:#15171A;color:#fff;border-radius:10px;font-size:18px;font-weight:700;line-height:1.5}
.hazards{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hz{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 12px 5px 8px;border-radius:999px;background:rgba(255,255,255,.65)}
.hz::before{content:"";width:10px;height:10px;border-radius:50%;background:#15171A}
.hz.hi::before{background:#C4122B}
.hz.hi{background:#fff;color:#8E1022}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:900;letter-spacing:-0.03em;margin-bottom:14px}
.card .hint{color:var(--muted);font-size:14px;margin:-6px 0 12px}
.card.mand{border-top:6px solid var(--blue)}
.card.proh{border-top:6px solid var(--red);background:var(--red-bg)}
.card.safe{border-top:6px solid var(--green);background:var(--green-bg)}
.card.warn{border-top:6px solid var(--yellow)}

.ppe{display:flex;flex-wrap:wrap;gap:14px}
.pp{display:flex;flex-direction:column;align-items:center;gap:6px;width:78px;text-align:center;font-size:13px;font-weight:700;line-height:1.3}
.pp i{width:58px;height:58px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:28px;font-style:normal}

.tabs{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:12px;margin-bottom:14px}
.tab{flex:1;padding:12px 4px;border:0;border-radius:8px;background:none;font-weight:700;font-size:16px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--blue) inset}
.rules li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rules li:first-child{border-top:0;padding-top:2px}
.rules li::before{content:"✓";flex:none;color:var(--blue);font-weight:900}
.nevers li{display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(128,128,128,.25);font-weight:500}
.nevers li:first-child{border-top:0;padding-top:2px}
.nevers li::before{content:"✕";flex:none;color:var(--red);font-weight:900}

details.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface)}
details.acc summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";font-weight:900;color:var(--muted);flex:none}
details.acc[open] summary::after{content:"－"}
details.acc[open]{border-color:var(--ink)}
details.acc .accb{padding:0 16px 12px}
details.acc .accb li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
details.acc .accb li::before{content:"•";flex:none;font-weight:900;color:var(--muted)}
details.acc ol.accb li::before{content:none}
.card.safe details.acc{background:var(--surface)}

.mis li{padding:12px 0;border-top:1px solid var(--line)}
.mis li:first-child{border-top:0;padding-top:0}
.mis .w{display:flex;gap:10px;font-weight:700}
.mis .w::before{content:"✕";color:var(--red);font-weight:900;flex:none}
.mis .r{display:flex;gap:10px;margin-top:4px;color:var(--muted)}
.mis .r::before{content:"✓";color:var(--green);font-weight:900;flex:none}

.emg{margin-top:16px}
.emg:first-of-type{margin-top:0}
.emg h3{font-size:17px;font-weight:700;margin-bottom:8px}
.emg ol,.steps{counter-reset:s}
.emg li,.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0}
.emg li::before,.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;
  font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.card.safe .emgbox,.emgbox{margin-top:12px}

.progress{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar{flex:1;height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
.count{font-weight:900;font-variant-numeric:tabular-nums}
.gh{font-size:14px;font-weight:700;color:var(--muted);margin:14px 0 2px}
.chk{display:flex;gap:14px;align-items:center;padding:12px 4px;min-height:52px;cursor:pointer;border-top:1px solid var(--line)}
.gh + .chk{border-top:0}
.chk input{width:26px;height:26px;flex:none;accent-color:var(--green)}
.chk input:checked + span{color:var(--muted);text-decoration:line-through}
.ghost{margin-top:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:700;font-size:14px}

.refs li{display:flex;gap:10px;padding:8px 0;font-size:15px}
.refs li::before{content:"§";flex:none;color:var(--muted);font-weight:900}

html:not([data-theme="light"]) .note{color:var(--muted);font-size:13px;margin-top:20px;line-height:1.6}

.flabel{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
.example{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);font-size:14px}
.example p{margin-top:6px;color:var(--muted);line-height:1.7}
.field{width:100%;padding:12px 14px;font:inherit;font-size:15px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea.field{resize:vertical;min-height:84px;margin-top:8px}
.btn{padding:12px 18px;border-radius:10px;border:2px solid var(--ink);background:var(--yellow);color:var(--yellow-ink);font-weight:900;font-size:15px}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .field{flex:1;min-width:200px;margin-top:0}

/* ---------- admin ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.panel h2{font-size:19px;font-weight:900;margin-bottom:6px}
.panel p{color:var(--muted);font-size:14px;margin-bottom:10px}
.warnmsg{margin-top:10px;font-size:13px;color:var(--red);font-weight:700}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.label{background:#fff;color:#15171A;border:2px dashed #9AA3AD;border-radius:10px;overflow:hidden;text-align:center;break-inside:avoid}
.label .lh{background:#FFC800;font-weight:900;font-size:16px;padding:8px 6px;line-height:1.3}
.label .qr{padding:14px 14px 6px}
.label .qr svg{width:100%;height:auto;display:block}
.label .lt{font-size:12px;font-weight:700;padding:0 8px 4px}
.label .li{font-size:11px;color:#5A616B;padding-bottom:10px;font-variant-numeric:tabular-nums}
.label .acts{display:flex;gap:6px;padding:8px;background:var(--bg);border-top:1px solid var(--line)}
.label .acts button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700}

dialog{max-height:92vh;overflow:auto;border:0;border-radius:14px;padding:16px;max-width:min(92vw,460px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line)}
dialog p{font-size:14px;color:var(--muted);margin:10px 0}
dialog img + .row{margin-bottom:14px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;font-size:14px;z-index:50}

@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
@media (max-width:420px){ .hero h1{font-size:28px} .intro h1{font-size:25px} }

@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--line:#999}
  .top,.panel,.acts,.back,.toast,.intro{display:none !important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .labels{grid-template-columns:repeat(3,1fr);gap:8mm}
  .label{border:1px dashed #666}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#list"><i aria-hidden="true"></i><span>촬영장비 안전 수칙</span></a>
    <nav class="nav" aria-label="메뉴">
      <a href="#list" id="nav-list">장비</a>
      <a href="#common" id="nav-common">공통 수칙</a>
      <a href="#admin" id="nav-admin">QR 관리</a>
    </nav>
    <button class="theme" id="theme" aria-label="화면 모드 바꾸기">◐</button>
  </div>
</header>

<main id="app"></main>
<dialog id="dlg"></dialog>

<script>
/* =====================================================================
   여기만 고치면 됩니다. 장비 · 안전 수칙 · 현장 공통 수칙
   ===================================================================== */

// 보호구 아이콘
const PPE = {
  "안전모": "⛑️", "안전화": "🥾", "작업장갑": "🧤", "내열장갑": "🧤", "보안경": "🥽",
  "형광 조끼": "🦺", "귀마개": "🎧", "안전대": "🪢", "헤드랜턴": "🔦", "방수 장비": "☔"
};

const CATS = [
  { id: "camera", name: "카메라" },
  { id: "drone",  name: "드론" },
  { id: "tripod", name: "삼각대" },
  { id: "light",  name: "조명" },
  { id: "gimbal", name: "짐벌" },
  { id: "jib",    name: "지브·크레인" },
  { id: "dolly",  name: "달리·슬라이더" },
  { id: "audio",  name: "오디오" },
  { id: "power",  name: "전원·배터리" }
];

// risk: high(높음) / mid(보통) / low(낮음)
// hz: [위험요소, 높음 여부]   mistakes: [잘못된 행동, 올바른 방법]
const EQUIP = [
{
  id: "camera-01", cat: "camera", icon: "📷", name: "카메라 (리그 포함)", risk: "mid",
  core: "낙하 방지 스트랩과 안전 와이어를 먼저 걸고, 렌즈를 태양 쪽으로 향하지 마세요.",
  hz: [["낙하", true], ["충돌", false], ["습기·먼지", false], ["근골격 피로", false]],
  ppe: ["작업장갑", "안전화", "형광 조끼"],
  before: [
    "마운트·플레이트·리그 나사가 풀리지 않았는지 손으로 한 번씩 확인합니다.",
    "스트랩 또는 안전 와이어를 장비와 고정점에 모두 연결합니다.",
    "배터리와 메모리카드를 장착하고 케이블이 통로에 늘어지지 않게 정리합니다.",
    "비·물가·모래 환경이면 레인커버를 먼저 씌웁니다.",
    "촬영 동선에 계단, 턱, 케이블, 파인 곳이 없는지 먼저 걸어보며 확인합니다."
  ],
  during: [
    "손에서 놓을 때는 반드시 거치대나 안전한 바닥에 둡니다. 의자·난간 위에 두지 않습니다.",
    "렌즈 교체는 바람과 먼지가 적은 곳에서 마운트가 아래를 향하게 하고 빠르게 합니다.",
    "무거운 리그는 어깨·허리 피로가 쌓이기 전에 교대하고, 장시간 들고 있지 않습니다.",
    "이동 중에는 케이블과 주변 인원을 확인하고 뒤로 걸을 때는 스포터를 붙입니다.",
    "사람이 많은 곳에서는 리그와 삼각대 다리가 사람 쪽으로 튀어나오지 않게 합니다."
  ],
  after: [
    "전원을 끄고 배터리·카드를 분리한 뒤 렌즈 캡을 닫습니다.",
    "젖었거나 찬 곳에서 온 장비는 케이스에 넣기 전에 천천히 실온에 적응시킵니다(결로 방지).",
    "이상 소음·긁힘·나사 풀림은 장비 담당자에게 바로 보고합니다."

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const catName = id => (CATS.find(c => c.id === id) || {}).name || "";

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function copyText(text, okMsg) {
  const ok = () => toast(okMsg || "복사했어요");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(() => window.prompt("아래 내용을 복사하세요", text));
  } else { window.prompt("아래 내용을 복사하세요", text); }
}

(function initTheme() {
  const saved = store.get("theme", null);
  if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").addEventListener("click", () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("theme", next);
  });
})();

function bindChk(key) {

/* ---------- QR ---------- */
function baseUrl() {
  const saved = store.get("baseUrl", "");
  return saved ? saved : location.href.split("#")[0];
}
function linkFor(id) { return baseUrl().split("#")[0] + "#" + id; }
function makeQR(text) {
  if (typeof qrcode !== "function") return null;
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  return qr;
}
function qrSvg(text) {
  const qr = makeQR(text);
  if (!qr) return "";
  const n = qr.getModuleCount(), m = 2;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  const s = n + m * 2;
  return `<svg viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="QR코드"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function labelCanvas(e) {
  const qr = makeQR(linkFor(e.id));
  if (!qr) return null;
  const W = 640, H = 800, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#FFC800"; x.fillRect(0, 0, W, 120);
  x.fillStyle = "#15171A";
  x.font = "900 40px 'Noto Sans KR', sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(e.name.length > 16 ? e.name.slice(0, 15) + "…" : e.name, W / 2, 62);
  const n = qr.getModuleCount(), mod = Math.floor(480 / (n + 4)), size = mod * (n + 4);
  const ox = (W - size) / 2, oy = 150;
  x.fillStyle = "#fff"; x.fillRect(ox, oy, size, size);
  x.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) x.fillRect(ox + (c + 2) * mod, oy + (r + 2) * mod, mod, mod);
  x.fillStyle = "#15171A"; x.font = "700 30px 'Noto Sans KR', sans-serif";
  x.fillText("QR을 스캔해 안전 수칙 확인", W / 2, oy + size + 50);
  x.fillStyle = "#5A616B"; x.font = "500 22px 'Noto Sans KR', sans-serif";
  x.fillText("장비 ID " + e.id, W / 2, oy + size + 92);
  return cv;
}

function ensureFont() {
  try {
    return Promise.all([document.fonts.load("900 40px 'Noto Sans KR'"), document.fonts.load("700 30px 'Noto Sans KR'"), document.fonts.load("500 22px 'Noto Sans KR'")]).catch(() => {});
  } catch (err) { return Promise.resolve(); }
}
function drawLabel(x, e, ox, oy, w, h) {
  const qr = makeQR(linkFor(e.id));
  if (!qr) return;
  x.fillStyle = "#fff"; x.fillRect(ox, oy, w, h);
  const hh = Math.round(h * 0.15);
  x.fillStyle = "#FFC800"; x.fillRect(ox, oy, w, hh);
  x.fillStyle = "#15171A"; x.textAlign = "center"; x.textBaseline = "middle";
  let fs = Math.round(w * 0.075);
  while (fs > 12) { x.font = "900 " + fs + "px 'Noto Sans KR', sans-serif"; if (x.measureText(e.name).width <= w - 24) break; fs -= 2; }
  x.fillText(e.name, ox + w / 2, oy + hh / 2);
  const n = qr.getModuleCount();
  const avail = Math.min(w - 30, h - hh - 90);
  const mod = Math.max(1, Math.floor(avail / (n + 4))), size = mod * (n + 4);
  const qx = ox + (w - size) / 2, qy = oy + hh + 10;
  x.fillStyle = "#fff"; x.fillRect(qx, qy, size, size);
  x.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) x.fillRect(qx + (c + 2) * mod, qy + (r + 2) * mod, mod, mod);
  x.fillStyle = "#15171A"; x.font = "700 " + Math.round(w * 0.052) + "px 'Noto Sans KR', sans-serif";
  x.fillText("QR을 스캔해 안전 수칙 확인", ox + w / 2, qy + size + w * 0.07);
  x.fillStyle = "#5A616B"; x.font = "500 " + Math.round(w * 0.045) + "px 'Noto Sans KR', sans-serif";
  x.fillText(e.id, ox + w / 2, qy + size + w * 0.07 + w * 0.065);
  x.strokeStyle = "#9AA3AD"; x.lineWidth = 2; x.setLineDash([8, 6]);
  x.strokeRect(ox + 1, oy + 1, w - 2, h - 2); x.setLineDash([]);
}
function sheetCanvases() {
  if (typeof qrcode !== "function") return [];
  const W = 1240, H = 1754, M = 60, G = 30, COLS = 3, ROWS = 4;
  const cw = Math.floor((W - 2 * M - (COLS - 1) * G) / COLS), ch = Math.floor((H - 2 * M - (ROWS - 1) * G) / ROWS);
  const per = COLS * ROWS, pages = [];
  for (let p = 0; p < EQUIP.length; p += per) {
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const x = cv.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
    EQUIP.slice(p, p + per).forEach((e, i) => {
      drawLabel(x, e, M + (i % COLS) * (cw + G), M + Math.floor(i / COLS) * (ch + G), cw, ch);
    });
    pages.push(cv);
  }
  return pages;
}

function renderAdmin() {
  const noLib = typeof qrcode !== "function";
  app.innerHTML = `
    <div class="intro"><h1>QR코드 관리</h1><p>장비마다 QR코드를 만들고 인쇄해서 장비에 붙이세요.</p></div>
    <section class="panel">
      <h2>사이트 주소</h2>
      <p>QR코드가 열 주소입니다. 이 사이트의 공유 링크를 붙여넣고 저장하세요. 주소가 바뀌면 QR코드도 다시 만들어야 합니다.</p>
      <div class="row">
        <input class="field" id="base" type="url" inputmode="url" value="${esc(baseUrl())}" aria-label="사이트 주소">
        <button class="btn" id="save">주소 저장</button>
      </div>
      <p class="warnmsg" id="warn"></p>
    </section>
    <section class="panel">
      <h2>라벨 출력</h2>
      <p>모든 장비의 QR 라벨을 A4 용지 한 장에 모아 이미지로 만듭니다(한 장에 12개). 이미지를 저장한 뒤 인쇄하거나 스티커 용지에 출력하세요.</p>
      <div class="row"><button class="btn" id="sheet">전체 라벨 시트 만들기</button><button class="btn sec" id="print">바로 인쇄</button></div>
      <p style="margin-top:10px">게시된 화면에서는 '바로 인쇄'가 막혀 있을 수 있어요. 인쇄창이 뜨지 않으면 시트 이미지를 사용하세요.</p>
    </section>
    ${noLib ? `<p class="warnmsg">QR 생성 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.</p>` : ""}
    <div class="labels" id="labels"></div>`;

  const warn = () => { $("#warn").textContent = /^https?:\/\//.test(baseUrl()) ? "" : "http:// 또는 https://로 시작하는 주소를 입력하세요."; };
  const draw = () => {
    $("#labels").innerHTML = EQUIP.map(e => `
      <div class="label" data-id="${e.id}">
        <div class="lh">${e.icon} ${esc(e.name)}</div>
        <div class="qr">${qrSvg(linkFor(e.id))}</div>
        <div class="lt">QR을 스캔해 안전 수칙 확인</div>
        <div class="li">${esc(e.id)}</div>
        <div class="acts">
          <button data-a="img">이미지</button>
          <button data-a="copy">링크 복사</button>
          <button data-a="open">열기</button>
        </div>
      </div>`).join("");
  };
  warn(); draw();

  $("#save").addEventListener("click", () => { store.set("baseUrl", $("#base").value.trim()); warn(); draw(); toast("주소를 저장했어요"); });
  $("#sheet").addEventListener("click", async () => {
    await ensureFont();
    const pages = sheetCanvases();
    if (!pages.length) { toast("QR 생성 도구를 불러오지 못했어요. 새로고침해 주세요."); return; }
    const dlg = $("#dlg");
    dlg.style.maxWidth = "min(94vw,720px)";
    dlg.innerHTML = `<p>이미지를 길게 누르거나 우클릭해서 저장한 뒤 인쇄하세요. A4 용지 기준입니다.</p>` +
      pages.map((cv, i) => { const d = cv.toDataURL("image/png"); return `<img src="${d}" alt="QR 라벨 시트 ${i + 1}">
        <div class="row"><a class="btn" href="${d}" download="qr-labels-${i + 1}.png" style="text-decoration:none">다운로드 (${i + 1}/${pages.length})</a></div>`; }).join("") +
      `<div class="row"><button class="btn sec" id="close">닫기</button></div>`;
    dlg.showModal();
    $("#close").addEventListener("click", () => dlg.close());
  });
  $("#print").addEventListener("click", () => { try { window.print(); } catch (err) { toast("이 화면에서는 인쇄가 막혀 있어요. 이미지로 저장해 인쇄하세요."); } });
  $("#labels").addEventListener("click", async ev => {
    const b = ev.target.closest("button"); if (!b) return;
    const e = EQUIP.find(x => x.id === b.closest(".label").dataset.id);
    if (b.dataset.a === "open") location.hash = e.id;
    if (b.dataset.a === "copy") copyText(linkFor(e.id), "링크를 복사했어요");
    if (b.dataset.a === "img") {
      await ensureFont();
      const cv = labelCanvas(e); if (!cv) return;
      const data = cv.toDataURL("image/png");
      const dlg = $("#dlg");
      dlg.style.maxWidth = "";
      dlg.innerHTML = `
        <img src="${data}" alt="${esc(e.name)} QR 라벨">
        <p>이미지를 길게 누르거나 우클릭해서 저장하세요.</p>
        <div class="row">
          <a class="btn" href="${data}" download="${esc(e.id)}-qr.png" style="text-decoration:none">다운로드</a>
          <button class="btn sec" id="close">닫기</button>
        </div>`;
      dlg.showModal();
      $("#close").addEventListener("click", () => dlg.close());
    }
  });
}

if (!location.hash) history.replaceState(null, "", location.href.split("#")[0] + "#list");
route();
</script>
</body>
</html>
